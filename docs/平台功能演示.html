<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福礼社平台 · 角色功能演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','PingFang SC',sans-serif; background:#f5f6fa; color:#303133; }
  header { background:linear-gradient(135deg,#c8102e,#e0463c); color:#fff; padding:22px 32px; }
  header h1 { font-size:22px; font-weight:600; }
  header p { margin-top:6px; font-size:13px; opacity:.85; }
  .wrap { display:flex; gap:20px; max-width:1440px; margin:24px auto; padding:0 24px; align-items:flex-start; }
  aside { width:300px; flex-shrink:0; background:#fff; border-radius:12px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .item { padding:13px 14px; border-radius:9px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; transition:all .15s; }
  .item:hover { background:#fdf0f0; }
  .item.active { background:#fdf0f0; border-color:#c8102e; }
  .item .t { font-size:14px; font-weight:600; line-height:1.5; }
  .item.active .t { color:#c8102e; }
  .item .m { font-size:12px; color:#909399; margin-top:4px; }
  main { flex:1; min-width:0; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:20px; }
  h2 { font-size:18px; margin-bottom:14px; }
  video { width:100%; border-radius:10px; background:#000; display:block; }
  .cue { padding:10px 14px; border-radius:8px; font-size:14px; line-height:1.6; cursor:pointer; color:#606266; display:flex; gap:10px; }
  .cue:hover { background:#f5f6fa; }
  .cue.on { background:#fdf0f0; color:#c8102e; font-weight:600; }
  .cue .no { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#e4e7ed; color:#606266; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .cue.on .no { background:#c8102e; color:#fff; }
  .tip { font-size:12px; color:#909399; line-height:1.8; }
  footer { text-align:center; padding:20px; font-size:12px; color:#909399; }
</style>
</head>
<body>
<header>
  <h1>福礼社平台 · 角色功能演示</h1>
  <p>七类角色关键工作流录屏 ｜ 内嵌中文字幕 ｜ 中文语音解说 ｜ 点击左侧切换角色，点击下方解说词跳转对应片段</p>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main>
    <div class="card">
      <h2 id="title"></h2>
      <video id="player" controls playsinline></video>
      <p class="tip" style="margin-top:10px">视频已内嵌硬字幕与中文配音（语音由系统合成），可直接播放，无需联网。</p>
    </div>
    <div class="card">
      <h2>解说词 · 点击跳转</h2>
      <div id="cues"></div>
    </div>
  </main>
</div>
<footer>福礼社电商平台 · 功能演示文档 ｜ 视频与解说一一对应，名称与实际操作匹配</footer>
<script>
const DATA = [{"id": "01", "title": "超级管理员 · 平台初始化和系统管理", "dur": 23, "mp4": "01-超级管理员-平台初始化和系统管理.mp4", "webm": "01-超级管理员-平台初始化和系统管理.webm", "cues": [{"start": 0.0, "end": 4.13, "text": "本段演示超级管理员的核心操作。"}, {"start": 4.13, "end": 9.4, "text": "使用管理员账号登录后台并查看工作台数据。"}, {"start": 9.4, "end": 13.19, "text": "用户管理支持查询和新增用户。"}, {"start": 13.19, "end": 17.05, "text": "角色与菜单管理用于分配权限。"}, {"start": 17.05, "end": 20.54, "text": "租户管理维护入驻商户信息。"}, {"start": 20.54, "end": 24.56, "text": "最后在数据备份中执行手动备份。"}]}, {"id": "02", "title": "商户管理员 · 商户工作台和商品订单财务", "dur": 28, "mp4": "02-商户管理员-商户工作台和商品订单财务.mp4", "webm": "02-商户管理员-商户工作台和商品订单财务.webm", "cues": [{"start": 0.0, "end": 4.51, "text": "本段演示商户管理员的日常经营操作。"}, {"start": 4.51, "end": 8.59, "text": "工作台汇总商品订单与财务概况。"}, {"start": 8.59, "end": 12.56, "text": "商品管理支持查询与新增商品。"}, {"start": 12.56, "end": 15.91, "text": "订单列表可查看交易明细。"}, {"start": 15.91, "end": 20.24, "text": "支付退款与发票模块处理资金往来。"}, {"start": 20.24, "end": 24.27, "text": "供应链页面管理采购库存与结算。"}, {"start": 24.27, "end": 27.18, "text": "各环节数据实时联动。"}]}, {"id": "03", "title": "采购专员 · 供应商和采购入库", "dur": 20, "mp4": "03-采购专员-供应商和采购入库.mp4", "webm": "03-采购专员-供应商和采购入库.webm", "cues": [{"start": 0.0, "end": 3.73, "text": "本段演示采购专员的业务流程。"}, {"start": 3.73, "end": 7.87, "text": "采购单页面支持查询与新建采购。"}, {"start": 7.87, "end": 11.25, "text": "供应商管理维护合作关系。"}, {"start": 11.25, "end": 14.81, "text": "库存页面实时反映入库情况。"}, {"start": 14.81, "end": 18.26, "text": "发货与结算完成对账闭环。"}]}, {"id": "04", "title": "供应商 · 采购接单发货和对账", "dur": 12, "mp4": "04-供应商-采购接单发货和对账.mp4", "webm": "04-供应商-采购接单发货和对账.webm", "cues": [{"start": 0.0, "end": 3.54, "text": "本段演示供应商的协作操作。"}, {"start": 3.54, "end": 7.46, "text": "供应商查看采购单并安排发货。"}, {"start": 7.46, "end": 10.61, "text": "对账页面核对结算数据。"}]}, {"id": "05", "title": "运营专员 · 商品订单和分销运营", "dur": 17, "mp4": "05-运营专员-商品订单和分销运营.mp4", "webm": "05-运营专员-商品订单和分销运营.webm", "cues": [{"start": 0.0, "end": 3.69, "text": "本段演示运营专员的日常工作。"}, {"start": 3.69, "end": 7.52, "text": "商品管理维护在售商品信息。"}, {"start": 7.52, "end": 11.37, "text": "分销规则与推广订单驱动增长。"}, {"start": 11.37, "end": 14.68, "text": "发票页面处理开票申请。"}]}, {"id": "06", "title": "分销商 · 选品分享和佣金", "dur": 12, "mp4": "06-分销商-选品分享和佣金.mp4", "webm": "06-分销商-选品分享和佣金.webm", "cues": [{"start": 0.0, "end": 3.64, "text": "本段演示分销商的推广操作。"}, {"start": 3.64, "end": 7.86, "text": "选品中心挑选商品并生成分享。"}, {"start": 7.86, "end": 11.1, "text": "佣金页面查看推广收益。"}]}, {"id": "07", "title": "普通用户 · 商城浏览下单支付和售后", "dur": 24, "mp4": "07-普通用户-商城浏览下单支付和售后.mp4", "webm": "07-普通用户-商城浏览下单支付和售后.webm", "cues": [{"start": 0.0, "end": 4.2, "text": "本段演示普通用户的完整购物流程。"}, {"start": 4.2, "end": 8.1, "text": "登录商城后浏览首页推荐商品。"}, {"start": 8.1, "end": 12.02, "text": "商品详情页查看图文与规格。"}, {"start": 12.02, "end": 15.09, "text": "加入购物车并提交订单。"}, {"start": 15.09, "end": 18.03, "text": "收银台完成模拟支付。"}, {"start": 18.03, "end": 22.23, "text": "订单中心可查看状态并申请售后。"}]}];
const list = document.getElementById('list');
const player = document.getElementById('player');
const title = document.getElementById('title');
const cuesBox = document.getElementById('cues');
let cur = 0;

DATA.forEach((v, i) => {
  const d = document.createElement('div');
  d.className = 'item' + (i === 0 ? ' active' : '');
  d.innerHTML = '<div class="t">' + v.title + '</div><div class="m">时长 ' + v.dur + ' 秒 · ' + v.cues.length + ' 段解说</div>';
  d.onclick = () => select(i);
  list.appendChild(d);
});

function select(i) {
  cur = i;
  const v = DATA[i];
  [...list.children].forEach((el, j) => el.classList.toggle('active', j === i));
  title.textContent = v.title;
  player.src = 'recordings/' + encodeURI(v.mp4);
  cuesBox.innerHTML = '';
  v.cues.forEach((c, j) => {
    const d = document.createElement('div');
    d.className = 'cue';
    d.innerHTML = '<span class="no">' + (j + 1) + '</span><span>' + c.text + '</span>';
    d.onclick = () => { player.currentTime = c.start + 0.05; player.play(); };
    cuesBox.appendChild(d);
  });
  player.play().catch(() => {});
}

player.addEventListener('timeupdate', () => {
  const t = player.currentTime;
  const cues = DATA[cur].cues;
  [...cuesBox.children].forEach((el, j) => {
    el.classList.toggle('on', t >= cues[j].start && t < cues[j].end);
  });
});

select(0);
player.pause();
</script>
</body>
</html>
