server:
  port: 8080

spring:
  application:
    name: fulishe-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: fulishe-user
          uri: lb://fulishe-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: fulishe-product
          uri: lb://fulishe-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=2
        - id: fulishe-coupon
          uri: lb://fulishe-coupon
          predicates:
            - Path=/api/coupon/**
          filters:
            - StripPrefix=2
        - id: fulishe-order
          uri: lb://fulishe-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: fulishe-pay
          uri: lb://fulishe-pay
          predicates:
            - Path=/api/pay/**
          filters:
            - StripPrefix=2
        - id: fulishe-account
          uri: lb://fulishe-account
          predicates:
            - Path=/api/account/**
          filters:
            - StripPrefix=2
        - id: fulishe-message
          uri: lb://fulishe-message
          predicates:
            - Path=/api/message/**
          filters:
            - StripPrefix=2
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
